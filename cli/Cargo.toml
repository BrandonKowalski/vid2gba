[package]
name = "vid2gba"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "vid2gba"
path = "src/main.rs"

[dependencies]
vid2gba-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"

[dev-dependencies]
tempfile = "3"
